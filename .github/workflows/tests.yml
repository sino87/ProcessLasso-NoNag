name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  transactions:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        shell: powershell
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r scripts/analysis-requirements.txt
      - name: Build and test native DLL
        shell: powershell
        run: ./scripts/Build-Native.ps1
      - name: Test compatibility and publication
        shell: powershell
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Test file transactions
        shell: powershell
        run: ./tests/Test-NoNag.ps1
      - name: Test worker exit codes
        shell: powershell
        run: ./tests/Test-WorkerExitCodes.ps1
      - name: Test upstream checks
        shell: powershell
        run: ./tests/Test-Upstream.ps1
      - name: Test distribution and published payload
        shell: powershell
        run: ./tests/Test-Package.ps1
