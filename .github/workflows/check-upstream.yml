name: Upstream static check

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      publish_results:
        description: Publish candidates, update README and notify Discord
        type: boolean
        default: true
      retry_closed:
        description: Reopen a candidate proposal after its previous PR was closed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: upstream-static-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      report_available: ${{ steps.report.outputs.available }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned analysis dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r scripts/analysis-requirements.txt
      - name: Test analysis and publication logic
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Test upstream checks
        run: ./tests/Test-Upstream.ps1
      - name: Check official stable x64 release
        run: ./scripts/Check-Upstream.ps1
      - name: Locate report
        id: report
        if: always()
        run: |
          if (Test-Path -LiteralPath dist/upstream/report.json) { 'available=true' >> $env:GITHUB_OUTPUT }
      - name: Save reports and preview package
        if: ${{ always() && steps.report.outputs.available == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: upstream-static-report
          path: |
            dist/upstream/report.json
            dist/upstream/analysis.json
            dist/upstream/*.zip
          retention-days: 30
          if-no-files-found: error

  publish:
    needs: check
    if: ${{ always() && needs.check.outputs.report_available == 'true' && github.ref_name == github.event.repository.default_branch && (github.event_name == 'schedule' || inputs.publish_results) }}
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: upstream-static-report
          path: dist/upstream
      - name: Publish candidate and notify Discord
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RETRY_CLOSED: ${{ inputs.retry_closed }}
        run: |
          $arguments = @('scripts/publish_upstream.py','--report','dist/upstream/report.json')
          if ($env:RETRY_CLOSED -eq 'true') { $arguments += '--retry-closed' }
          python @arguments
      - name: Commit check state and README
        if: always()
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git diff --quiet -- README.md .github/upstream-state.json
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git fetch origin $env:DEFAULT_BRANCH
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify remote branch.' }
          $remote = git rev-parse FETCH_HEAD
          $current = git rev-parse HEAD
          if ($remote -ne $current) { throw 'Remote branch changed; rerun the check.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md .github/upstream-state.json
          git commit -m 'Update upstream check status'
          if ($LASTEXITCODE -ne 0) { throw 'Commit failed.' }
          git push origin "HEAD:refs/heads/$env:DEFAULT_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw 'Push failed.' }
