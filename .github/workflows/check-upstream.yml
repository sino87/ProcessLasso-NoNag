name: Upstream compatibility check

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      publish_results:
        description: Update README and notify Discord
        type: boolean
        default: true
      development_build:
        description: Test the development DLL without publishing results
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: upstream-compatibility-check
  cancel-in-progress: false

jobs:
  check:
    if: ${{ github.event_name != 'schedule' || vars.DLL_CHECKS_ENABLED == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      report_available: ${{ steps.report.outputs.available }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned check dependencies
        id: dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r scripts/analysis-requirements.txt
      - name: Build and test native tooling
        id: native
        run: ./scripts/Build-Native.ps1
      - name: Test compatibility and publication logic
        id: unit
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Test upstream checks
        id: upstream
        run: ./tests/Test-Upstream.ps1
      - name: Check official stable x64 release
        env:
          GH_TOKEN: ${{ github.token }}
          DEVELOPMENT_BUILD: ${{ inputs.development_build }}
        run: |
          $arguments = @{}
          if ($env:DEVELOPMENT_BUILD -eq 'true') { $arguments.DevelopmentDll = Join-Path $PWD 'bin/version.dll' }
          ./scripts/Check-Upstream.ps1 @arguments
      - name: Locate report
        id: report
        if: always()
        env:
          DEVELOPMENT_BUILD: ${{ inputs.development_build }}
        run: |
          if (-not (Test-Path -LiteralPath dist/upstream/report.json)) {
            Import-Module ./scripts/Upstream.psm1 -Force
            $stage = 'workflow-setup'
            if ('${{ steps.dependencies.outcome }}' -eq 'failure') { $stage = 'dependencies' }
            if ('${{ steps.native.outcome }}' -eq 'failure') { $stage = 'native-build-or-test' }
            if ('${{ steps.unit.outcome }}' -eq 'failure') { $stage = 'checker-tests' }
            if ('${{ steps.upstream.outcome }}' -eq 'failure') { $stage = 'upstream-tests' }
            $report = @{ Schema=3; Status='error'; Version=''; NoNagRelease=''; ExecutableHash=''; DllHash='';
              CheckerRevision=(Get-CheckerRevision); SourceRevision=$env:GITHUB_SHA;
              Development=($env:DEVELOPMENT_BUILD -eq 'true'); ErrorKey=$stage;
              Reason="Check failed at stage: $stage."; CheckedAt=[DateTime]::UtcNow.ToString('o') }
            New-Item -ItemType Directory -Force dist/upstream | Out-Null
            $report | ConvertTo-Json | Set-Content -LiteralPath dist/upstream/report.json -Encoding utf8
          }
          'available=true' >> $env:GITHUB_OUTPUT
      - name: Save reports
        if: ${{ always() && steps.report.outputs.available == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: upstream-compatibility-report
          path: |
            dist/upstream/report.json
            dist/upstream/compatibility.json
          retention-days: 30
          if-no-files-found: error

  publish:
    needs: check
    if: ${{ always() && needs.check.outputs.report_available == 'true' && !inputs.development_build && github.ref_name == github.event.repository.default_branch && (github.event_name == 'schedule' || inputs.publish_results) }}
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: upstream-compatibility-report
          path: dist/upstream
      - name: Update status and notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/publish_upstream.py --report dist/upstream/report.json
      - name: Commit check state and README
        if: always()
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git diff --quiet -- README.md .github/upstream-state.json
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git fetch origin $env:DEFAULT_BRANCH
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify remote branch.' }
          $remote = git rev-parse FETCH_HEAD
          $current = git rev-parse HEAD
          if ($remote -ne $current) { throw 'Remote branch changed; rerun the check.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md .github/upstream-state.json
          git commit -m 'Update upstream check status'
          if ($LASTEXITCODE -ne 0) { throw 'Commit failed.' }
          git push origin "HEAD:refs/heads/$env:DEFAULT_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw 'Push failed.' }
