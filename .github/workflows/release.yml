name: Draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release version tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install check dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r scripts/analysis-requirements.txt
      - name: Build and test native DLL
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: ./scripts/Build-Native.ps1 -BuildId $env:RELEASE_TAG
      - name: Test compatibility and publication
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Test file transactions
        run: ./tests/Test-NoNag.ps1
      - name: Test worker exit codes
        run: ./tests/Test-WorkerExitCodes.ps1
      - name: Test upstream and distribution checks
        run: |
          ./tests/Test-Upstream.ps1
          ./tests/Test-Package.ps1
      - name: Build distribution
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: ./scripts/Build-Release.ps1 -Tag $env:RELEASE_TAG
      - name: Create release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9][A-Za-z0-9.-]*)?$') {
            throw 'Expected a version tag such as v1.0.0 or v1.0.0-rc.1.'
          }
          git fetch --tags origin
          git show-ref --verify --quiet "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -eq 0) { throw "Tag already exists: $env:RELEASE_TAG" }
          git tag $env:RELEASE_TAG $env:GITHUB_SHA
          git push origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Release tag creation failed.' }
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $archive = Join-Path $PWD "dist/ProcessLasso-NoNag-$env:RELEASE_TAG.zip"
          gh release create $env:RELEASE_TAG $archive dist/SHA256SUMS.txt --verify-tag --draft --title $env:RELEASE_TAG --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
